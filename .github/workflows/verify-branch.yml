name: Verifikasi branch deploy

# Workflow sementara: menjalankan test untuk branch kerja ini, karena ci.yml
# hanya terpicu di main/PR-ke-main dan lingkungan pengembangan tidak punya
# MySQL. Dihapus setelah verifikasi selesai.

on:
  push:
    branches:
      - claude/deploy-koperasi-ksp-laravel-73960e

jobs:
  fokus:
    name: Test terkait perubahan
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: true
          MYSQL_DATABASE: koperasi_sejahtera_bersama_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, bcmath, pcntl, posix
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Copy .env
        run: cp .env.example .env

      - name: Generate app key
        run: php artisan key:generate

      - name: Test BrandingService (fitur latar login)
        run: php artisan test --filter=BrandingServiceTest

      - name: Test yang menyentuh render view & cetakan
        run: php artisan test tests/Feature/Prints tests/Feature/Admin

  penuh:
    name: Test suite penuh
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: true
          MYSQL_DATABASE: koperasi_sejahtera_bersama_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, bcmath, pcntl, posix
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Copy .env
        run: cp .env.example .env

      - name: Generate app key
        run: php artisan key:generate

      - name: Run test suite
        run: php artisan test
