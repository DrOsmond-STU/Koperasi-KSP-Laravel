name: Kirim source ke hosting sik-kppd.com

# Workflow sementara: dipakai sekali untuk mengirim source code ke shared
# hosting (cPanel) sik-kppd.com, karena repo ini privat sehingga server
# hosting tidak bisa meng-clone-nya sendiri. Dihapus setelah instalasi awal
# selesai.

on:
  push:
    branches:
      - claude/deploy-koperasi-ksp-laravel-73960e

jobs:
  upload:
    name: Bundle & upload source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bundle source (tanpa .git, dump DB, tests, workflow)
        run: |
          tar -czf /tmp/src.tar.gz \
            --exclude=./.git \
            --exclude=./.github \
            --exclude=./database-dumps \
            --exclude=./tests \
            --exclude=./node_modules \
            --exclude=./vendor \
            -C . .
          ls -l /tmp/src.tar.gz
          sha256sum /tmp/src.tar.gz

      - name: Upload ke endpoint sementara di hosting
        run: |
          code=$(curl -sS --retry 3 --retry-delay 5 -m 180 \
            -o /tmp/resp.txt -w '%{http_code}' \
            -X POST \
            -H 'Content-Type: application/octet-stream' \
            --data-binary @/tmp/src.tar.gz \
            "https://sik-kppd.com/_recv_rBrM20k97ifYlhkAETkADpgIgul4.php?t=rBrM20k97ifYlhkAETkADpgIgul4&name=src.tar.gz")
          echo "HTTP $code"
          cat /tmp/resp.txt
          test "$code" = "200"
